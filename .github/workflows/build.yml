
name: Build QXL Brightness Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout modified source
        uses: actions/checkout@v4

      - name: Locate MSBuild
        id: toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1

          if (!$msbuild) {
            throw "MSBuild was not found"
          }

          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV

      - name: Compile QXL driver
        shell: pwsh
        run: |
          & $env:MSBUILD_PATH "qxldod/qxldod.vcxproj" `
            /t:Build `
            /p:Configuration=Win10Debug_NoSign `
            /p:Platform=x64 `
            /m `
            /v:minimal `
            /fl `
            "/flp:logfile=build.log;verbosity=diagnostic"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qxl-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload compiled driver
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qxl-brightness-driver
          path: |
            **/qxldod.sys
            **/qxldod.pdb
          if-no-files-found: warn
