name: Build QXL Brightness Driver (compile and link probe)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout QXL source
        uses: actions/checkout@v4

      - name: Restore SPICE include dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $includeRoot = Join-Path $env:GITHUB_WORKSPACE 'qxldod\Include'
          $wanted = Join-Path $includeRoot 'include\types.h'
          if (!(Test-Path $includeRoot)) { throw "Missing expected QXL folder: $includeRoot" }
          New-Item -ItemType Directory -Force -Path (Split-Path $wanted) | Out-Null
          if (!(Test-Path $wanted)) {
            $candidate = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'qxldod') -Filter 'types.h' -Recurse -File |
              Where-Object { $_.FullName -ne $wanted } | Select-Object -First 1
            if ($candidate) {
              Write-Host "Reusing existing source header: $($candidate.FullName)"
              Copy-Item -LiteralPath $candidate.FullName -Destination $wanted
            } else {
              # Source: Debian spice-protocol 0.12.14 (legacy SPICE protocol declarations)
              $uri = 'https://sources.debian.org/data/main/s/spice-protocol/0.12.14-1/spice/types.h'
              Write-Host "Fetching missing SPICE types.h: $uri"
              Invoke-WebRequest -Uri $uri -OutFile $wanted -UseBasicParsing
              if ((Get-Item $wanted).Length -lt 200) { throw 'Downloaded types.h is unexpectedly short.' }
            }
          }
          Write-Host "Resolved header: $wanted"

          # Fix the legacy SPICE header's non-standard stdint include.
          # This changes only the temporary CI build copy.
          $header = [System.IO.File]::ReadAllText($wanted)

          if ($header.Contains('include/stdint.h')) {
            Write-Host "Correcting legacy stdint.h include"
            $header = $header.Replace('include/stdint.h', 'stdint.h')
            [System.IO.File]::WriteAllText(
              $wanted,
              $header,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          Write-Host "SPICE types.h dependency lines:"
          Get-Content $wanted |
            Select-String -Pattern 'include.*stdint'

      - name: Find MSBuild and WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild not found' }
          Write-Host "MSBuild: $msbuild"
          "MSBUILD_PATH=$msbuild" >> $env:GITHUB_ENV
          $wdk = "${env:ProgramFiles(x86)}\Windows Kits\10\build\10.0.26100.0\WindowsDriver.common.targets"
          if (!(Test-Path $wdk)) { throw "Required WDK targets missing: $wdk" }

      - name: Compile and verify QXL driver
        shell: pwsh
        env:
          CL: /wd4996
        run: |
          $ErrorActionPreference = 'Stop'

          $args = @(
            'qxldod\qxldod.vcxproj',
            '/t:BuildCompile;BuildLink',
            '/p:Configuration=Win10Debug_NoSign',
            '/p:Platform=x64',
            '/v:minimal',
            '/fl',
            '/flp:logfile=build.log;verbosity=normal'
          )

          & $env:MSBUILD_PATH @args
          $buildExit = $LASTEXITCODE

          $drivers = @(
            Get-ChildItem -Path 'qxldod' -Recurse -File -Filter 'qxldod.sys'
          )

          if ($drivers.Count -eq 0) {
            throw "Driver binary missing. MSBuild exit: $buildExit"
          }

          foreach ($driver in $drivers) {
            if ($driver.Length -lt 4096) {
              throw "Driver binary is unexpectedly small."
            }

            $stream = [System.IO.File]::OpenRead($driver.FullName)
            try {
              $first = $stream.ReadByte()
              $second = $stream.ReadByte()
            }
            finally {
              $stream.Dispose()
            }

            if ($first -ne 77 -or $second -ne 90) {
              throw "Invalid Windows PE binary."
            }

            Write-Host "QXL DRIVER COMPILED: $($driver.FullName)"
            Write-Host "Size: $($driver.Length) bytes"
          }

          if ($buildExit -ne 0) {
            Write-Warning "MSBuild returned $buildExit after producing the driver."
            Write-Warning "Packaging/signing has NOT succeeded."
            if (Test-Path 'build.log') {
              Select-String -Path 'build.log' -Pattern 'error (MSB|C|LNK)[0-9]+' |
                Select-Object -Last 15 |
                ForEach-Object { Write-Warning $_.Line }
            }
          }

          Write-Host "DIAGNOSTIC DRIVER BINARY VERIFIED"
          Write-Host "UNSIGNED - DO NOT INSTALL"

          # A nonzero MSBuild result is acceptable for this diagnostic
          # build ONLY when the sole error is the known INF-copy failure.
          if ($buildExit -ne 0) {
            if (!(Test-Path 'build.log')) {
              throw "Build log missing; cannot verify packaging failure."
            }

            $errors = @(
              Select-String -Path 'build.log' `
                -Pattern 'error (MSB|C|LNK)[0-9]+:'
            )

            $unexpected = @(
              $errors | Where-Object {
                $_.Line -notmatch 'error MSB3030:.*qxldod\\.inf'
              }
            )

            if ($errors.Count -eq 0 -or $unexpected.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Line }
              throw "Unexpected build failure; refusing to report success."
            }

            Write-Host "Confirmed: only known INF-copy error remains."
          }

          # Explicitly clear the native command exit code after validation.
          $global:LASTEXITCODE = 0
          exit 0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qxl-compile-logs
          path: |
            build.log
            **/*.tlog
          if-no-files-found: warn

      - name: Upload unsigned experimental binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qxl-brightness-UNSIGNED-DO-NOT-INSTALL
          path: |
            **/qxldod.sys
            **/qxldod.pdb
          if-no-files-found: error
